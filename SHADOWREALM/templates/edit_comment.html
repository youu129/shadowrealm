{% extends 'base.html' %}

{% block title %}
Edit Comment | ShadowRealm
{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto">

    <div class="glass-panel p-6">

        <h1 class="text-2xl font-bold text-white">
            Edit Comment
        </h1>

        <p class="text-gray-500 mt-2 mb-6">
            Change what you said.
        </p>

        <form method="POST">

            {% csrf_token %}

            <textarea
                name="body"
                rows="5"
                required
                class="w-full bg-black/40
                       border border-white/10
                       rounded-lg p-4
                       text-gray-200
                       focus:outline-none
                       focus:border-red-700"
            >{{ comment.body }}</textarea>

            <div class="flex gap-3 mt-4">

                <button
                    type="submit"
                    class="bg-red-800 hover:bg-red-700
                           text-white font-semibold
                           px-5 py-2.5 rounded-lg"
                >
                    Save Changes
                </button>

                <a
                    href="{% url 'story_detail' comment.story.slug %}"
                    class="bg-white/5 hover:bg-white/10
                           text-gray-300
                           px-5 py-2.5 rounded-lg"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
