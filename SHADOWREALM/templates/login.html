{% extends 'base.html' %}

{% block title %}
Login | ShadowRealm
{% endblock %}

{% block content %}
<style>
    .glass-cracks {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        display: none;
    overflow: hidden;
}

.glass-cracks.active {
    display: block;
}

.glass-cracks svg {
    width: 100%;
    height: 100%;
}

.glass-shard {
    fill: rgba(226,232,240,0.08);
}

.crack-line {
    fill: none;
    stroke: rgba(226,232,240,0.75);
    stroke-width: 0.35;
    vector-effect: non-scaling-stroke;

    stroke-dasharray: 400;
    stroke-dashoffset: 400;

    animation: crack-draw .4s ease-out forwards;
}

@keyframes crack-draw {
    to {
        stroke-dashoffset: 0;
    }
}
</style>
<div class="max-w-md mx-auto mt-12">

    <div class="glass-panel p-8">

        <h1 class="text-3xl font-black text-center text-red-600 mb-2">
            Welcome Back
        </h1>

        <p class="text-center text-gray-500 mb-8">
            Enter the ShadowRealm
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-5">

                <label class="block text-sm mb-2">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    class="w-full bg-black border border-gray-700 rounded-md px-4 py-3 text-white outline-none"
                    placeholder="Enter your username"
                >

            </div>

            <div class="mb-6">

                <label class="block text-sm mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    class="w-full bg-black border border-gray-700 rounded-md px-4 py-3 text-white outline-none"
                    placeholder="Enter your password"
                >

            </div>

            <button
                type="submit"
                class="w-full bg-red-800 hover:bg-red-700 text-white font-semibold py-3 rounded-md transition"
            >
                Login
            </button>

        </form>

        <p class="text-center text-gray-500 mt-6">

            Don't have an account?

            <a
                href="{% url 'register' %}"
                class="text-red-500 hover:text-red-400"
            >
                Create Account
            </a>

        </p>

    </div>

</div>

<div id="glass-cracks" class="glass-cracks" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">

        <polygon
            class="glass-shard"
            points="48,30 74,26 57,46"
        />

        <polygon
            class="glass-shard"
            points="57,46 52,70 26,56"
        />

        <path class="crack-line"
            d="M50 5 L48 30 L57 46 L52 70 L60 95"/>

        <path class="crack-line"
            d="M48 30 L22 22 L4 12"/>

        <path class="crack-line"
            d="M48 30 L74 26 L96 16"/>

        <path class="crack-line"
            d="M57 46 L86 52 L100 58"/>

        <path class="crack-line"
            d="M57 46 L26 56 L2 62"/>

        <path class="crack-line"
            d="M52 70 L28 86 L18 100"/>

        <path class="crack-line"
            d="M52 70 L80 84 L90 100"/>

    </svg>
</div>

<!-- YOUR EXISTING CRACK EFFECT SCRIPT  -->
{% block extra_js %}
<script>

const glassCracks = document.getElementById('glass-cracks');

let glassClicks = 0;
let crackTimer = null;

document.addEventListener('click', function () {

    glassClicks++;

    if (glassClicks > 3) {

        glassCracks.classList.add('active');

        /*
         * Restart crack animation.
         */
        const lines = glassCracks.querySelectorAll('.crack-line');

        lines.forEach(line => {
            line.style.animation = 'none';
            void line.offsetWidth;
            line.style.animation = '';
        });

        if (crackTimer) {
            clearTimeout(crackTimer);
        }

        crackTimer = setTimeout(() => {

            glassCracks.classList.remove('active');
            glassClicks = 0;

        }, 4000);
    }
});

</script>
{% endblock %}

{% endblock %}
