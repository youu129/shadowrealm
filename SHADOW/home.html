<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADOWREALM - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.9)),
    url('https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1600&q=80');
    background-size:cover;
    color:white;
}

.container{
    width:380px;
    background:rgba(20,20,20,.92);
    padding:40px;
    border-radius:15px;
    border:1px solid crimson;
    box-shadow:0 0 25px rgba(255,0,0,.4);
}

h1{
    text-align:center;
    color:#ff2b2b;
    margin-bottom:10px;
    letter-spacing:2px;
}

p{
    text-align:center;
    color:#aaa;
    margin-bottom:30px;
}

.input-box{
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
    font-size:15px;
    outline:none;
}

.input-box input:focus{
    border:1px solid crimson;
}

.options{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin-bottom:20px;
}

.options a{
    color:#ff4d4d;
    text-decoration:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:crimson;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#ff1a1a;
}

.signup{
    text-align:center;
    margin-top:20px;
    color:#bbb;
}

.signup a{
    color:#ff4d4d;
    text-decoration:none;
    font-weight:bold;
}

.social{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.social button{
    background:#222;
    border:1px solid #444;
}

.social button:hover{
    border-color:crimson;
    background:#111;
}
</style>

</head>
<body>

<div class="container">

<h1>SHADOWREALM</h1>
<p>Welcome Back</p>

<form>

<div class="input-box">
<input type="email" placeholder="Email Address" required>
</div>

<div class="input-box">
<input type="password" placeholder="Password" required>
</div>

<div class="options">
<label>
<input type="checkbox">
 Remember Me
</label>

<a href="#">Forgot Password?</a>
</div>

<button type="submit">LOGIN</button>

<div class="social">
<button type="button">Google</button>
<button type="button">Facebook</button>
</div>

<div class="signup">
Don't have an account?
<a href="signup.html">Create Account</a>
</div>

</form>

</div>

</body>
</html>
